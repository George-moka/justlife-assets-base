<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="build" content="live-builder-v9.8" />
<title>Justlife DS Builder · live components</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root{
    --s-bg:#FBFAF7; --s-surface:#FFFFFF; --s-surface-2:#F5F3EE;
    --s-ink:#0C1116; --s-muted:#5B6470; --s-faint:#9AA2AC;
    --s-line:#E8E4DC; --s-line2:#DCD7CD;
    --s-brand:#00C3FF; --s-brand-deep:#00A8DC; --s-soft:rgba(0,195,255,.12);
    --s-dot:rgba(12,17,22,.06); --s-shadow:0 24px 50px -28px rgba(20,24,30,.30);
  }
  html[data-theme="dark"]{
    --s-bg:#0A0E13; --s-surface:#121822; --s-surface-2:#0E141C;
    --s-ink:#EAF1F8; --s-muted:#8A97A6; --s-faint:#5A6573;
    --s-line:#1E2731; --s-line2:#283341;
    --s-brand:#21CEFF; --s-brand-deep:#21CEFF; --s-soft:rgba(33,206,255,.14);
    --s-dot:rgba(255,255,255,.05); --s-shadow:0 20px 50px -20px rgba(0,0,0,.7);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--s-bg); color:var(--s-ink);
    font-family:'Poppins',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;
    background-image:radial-gradient(var(--s-dot) 1.2px, transparent 1.2px);
    background-size:26px 26px;
  }
  textarea,input,button{font-family:inherit}
  @keyframes spin{to{transform:rotate(360deg)}}
  .spin{animation:spin 1s linear infinite}
  ::selection{background:var(--s-brand);color:#04222d}
  ::-webkit-scrollbar{width:0;height:0}
  #loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:var(--s-faint);font-size:13px}
  :focus-visible{outline:2px solid var(--s-brand);outline-offset:3px;border-radius:6px}

  .s-eyebrow{font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--s-brand-deep);display:inline-flex;align-items:center;gap:8px}
  .s-eyebrow::before{content:"";width:20px;height:1px;background:var(--s-brand)}
  .s-display{font-family:'Poppins',sans-serif}
  .s-header{position:sticky;top:0;z-index:50;backdrop-filter:blur(12px);background:color-mix(in srgb,var(--s-bg) 82%,transparent);border-bottom:1px solid var(--s-line)}
  .s-header-in{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:12px;height:62px;padding:0 28px}
  .s-main{max-width:1180px;margin:0 auto;padding:44px 28px 90px}
  .s-input{background:var(--s-surface);border:1px solid var(--s-line2);border-radius:14px;color:var(--s-ink);outline:none;transition:border-color .2s,box-shadow .2s}
  .s-input:focus{border-color:var(--s-brand);box-shadow:0 0 0 4px var(--s-soft)}
  .s-input::placeholder{color:var(--s-faint)}
  .s-chip{font-size:12px;color:var(--s-muted);background:var(--s-surface);border:1px solid var(--s-line2);border-radius:999px;padding:8px 14px;cursor:pointer;transition:all .2s}
  .s-chip:hover{border-color:var(--s-brand);color:var(--s-ink);transform:translateY(-1px)}
  .s-btn-primary{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:#00C3FF;color:#fff;border:none;border-radius:999px;padding:13px 24px;font-weight:600;font-size:14px;cursor:pointer;box-shadow:0 8px 24px -8px var(--s-brand);transition:transform .15s,opacity .2s}
  .s-btn-primary:hover{transform:translateY(-2px)}
  .s-btn-primary:disabled{opacity:.7;transform:none;cursor:default}
  .s-btn-ghost{background:transparent;border:1.5px solid var(--s-brand);color:var(--s-brand-deep);border-radius:12px;padding:10px 18px;font-weight:600;font-size:13px;cursor:pointer;transition:background .2s}
  .s-btn-ghost:hover{background:var(--s-soft)}
  .s-btn-ghost:disabled{opacity:.6;cursor:default}
  .s-btn-dark{display:inline-flex;align-items:center;background:var(--s-ink);color:var(--s-bg);border:none;border-radius:12px;padding:9px 16px;font-weight:600;font-size:12.5px;cursor:pointer}
  .s-card{background:var(--s-surface);border:1px solid var(--s-line);border-radius:18px;box-shadow:var(--s-shadow)}
  .s-icon-btn{width:38px;height:38px;border-radius:999px;border:1px solid var(--s-line2);background:transparent;color:var(--s-ink);cursor:pointer;display:grid;place-items:center;transition:border-color .2s,background .2s}
  .s-icon-btn:hover{border-color:var(--s-brand);background:var(--s-soft)}
  @media (prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;transition:none!important}}
</style>
<script>try{document.documentElement.dataset.theme=localStorage.getItem('jl-theme')||'light'}catch(e){document.documentElement.dataset.theme='light'}</script>
</head>
<body>
<div id="root"><div id="loading">Loading Justlife DS Builder…</div></div>

</script>
